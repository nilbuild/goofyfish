<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pogo Hop</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #ffffff;
    --card: #ffffff;
    --ink: #1f2329;
    --muted: #7a7a7a;
    --soft: #a3a3a3;
    --faint: #d4d4d4;
    --line: #ededed;
    --dot: rgba(31, 41, 55, .13);
    --chip: #f5f5f5;
    --ring: rgba(0, 0, 0, .06);
    --butter: #fde68a;
    --butter-hi: #fcd34d;
    --butter-soft: #fef3c7;
    --umber: #78350f;
    --amber: #b45309;
    --font: 'Balsamiq Sans', 'Comic Sans MS', ui-rounded, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; color: var(--ink); overflow: hidden;
    background-color: var(--paper);
    background-image: radial-gradient(circle, var(--dot) 0.8px, transparent 1px);
    background-size: 24px 24px; background-position: 12px 12px;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
    font-family: var(--font); font-weight: 400;
  }
  h1, b, strong { font-weight: 400; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; outline: none; padding: 0; }
  .panel { background: var(--card); border-radius: 14px; box-shadow: 0 0 0 1px var(--ring), 0 2px 8px rgba(0, 0, 0, .04), 0 1px 2px rgba(0, 0, 0, .03); }
  .label { font-size: 13px; color: var(--muted); line-height: 1.2; }

  #hud {
    position: fixed; left: 0; top: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 20px) 0 0 max(20px, env(safe-area-inset-left, 0px));
    pointer-events: none; transition: opacity .35s ease;
  }
  #hud.hidden { opacity: 0; }
  .board { padding: 14px 18px; display: flex; align-items: flex-end; gap: 28px; }
  .stat .label { margin-top: 6px; }
  #score { font-size: 44px; line-height: .85; font-variant-numeric: tabular-nums; display: inline-block; transform-origin: left bottom; }
  #score.bump { animation: bump .35s ease; }
  @keyframes bump { 0% { transform: scale(1); } 35% { transform: scale(1.12); } 100% { transform: scale(1); } }
  #best { font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--muted); }

  #hint {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); transform: translateX(-50%);
    font-size: 14.5px; color: var(--muted); white-space: nowrap; pointer-events: none; transition: opacity .4s;
    display: flex; align-items: center; gap: 8px;
  }
  #hint.hidden { opacity: 0; }
  kbd { font: inherit; font-size: 12px; color: #5a5a5a; background: var(--chip); box-shadow: 0 0 0 1px rgba(0, 0, 0, .07); border-radius: 6px; padding: 3px 8px; line-height: 1.25; }
  @media (hover: none) { .kbd-only { display: none; } }

  #overlay {
    position: fixed; inset: 0; display: grid; place-items: center; padding: 20px;
    background: rgba(20, 22, 26, .24);
    opacity: 0; pointer-events: none; transition: opacity .3s ease; overflow-y: auto;
  }
  #overlay.on { opacity: 1; pointer-events: auto; }
  .card {
    width: min(360px, 100%); background: var(--card); border-radius: 18px; padding: 28px;
    transform: translateY(12px); transition: transform .35s cubic-bezier(.2, .9, .3, 1); display: none;
  }
  #overlay.on .card.show { transform: none; }
  .card.show { display: block; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .logo { width: 46px; height: 46px; border-radius: 12px; background: #262626; display: grid; place-items: center; margin-bottom: 20px; }
  .logo svg { width: 26px; height: 26px; }
  .title { font-size: 32px; line-height: 1; margin: 0; }
  .keys { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--muted); font-size: 15px; margin: 18px 0 10px; }
  .tag { color: var(--muted); font-size: 15px; line-height: 1.5; margin: 0 0 26px; }
  .chip { display: inline-flex; align-items: center; font-size: 13px; padding: 3px 9px; border-radius: 7px; background: var(--butter); color: var(--umber); white-space: nowrap; }
  .actions { display: flex; gap: 10px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 10px; height: 50px; border-radius: 12px; font-size: 17px; transition: transform .12s, background .2s; }
  .btn:active { transform: scale(.98); }
  .btn.primary { flex: 1; background: var(--butter); color: var(--umber); box-shadow: 0 0 0 1px rgba(180, 83, 9, .2), 0 2px 8px rgba(0, 0, 0, .04); }
  .btn.primary kbd { background: rgba(255, 255, 255, .55); color: #92400e; box-shadow: none; }
  .btn.ghost { width: 50px; flex: none; background: var(--chip); box-shadow: 0 0 0 1px rgba(0, 0, 0, .05); }
  @media (hover: hover) {
    .btn.primary:hover { background: var(--butter-hi); }
    .btn.ghost:hover { background: #ececec; }
  }
  .btn svg { width: 19px; height: 19px; }
  .foot { text-align: center; color: var(--soft); font-size: 13px; line-height: 1.5; margin-top: 22px; }
  .foot:empty { display: none; }
  .exit { display: block; width: fit-content; margin: 18px auto 0; font-size: 14px; color: var(--soft); text-decoration: none; }
  @media (hover: hover) { .exit:hover { color: var(--ink); } }
  .result { display: flex; align-items: flex-end; gap: 36px; margin: 22px 0 28px; }
  .result .label { margin-top: 8px; }
  #endScore { font-size: 72px; line-height: .8; font-variant-numeric: tabular-nums; display: block; }
  #endBest { font-size: 32px; line-height: .9; font-variant-numeric: tabular-nums; }
  #toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translate(-50%, 20px);
    background: #262626; color: #fff; font-size: 14px; padding: 10px 16px; border-radius: 10px;
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; white-space: nowrap; z-index: 5;
  }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  .back { position: fixed; z-index: 6; top: calc(env(safe-area-inset-top, 0px) + 22px); right: max(20px, env(safe-area-inset-right, 0px)); font-size: 14px; color: var(--soft); text-decoration: none; }
  .back:hover { color: var(--ink); }
  @media (max-width: 420px) {
    #hud { padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-top: calc(env(safe-area-inset-top, 0px) + 14px); }
    .board { padding: 12px 14px; }
    #score { font-size: 38px; }
    .back { top: calc(env(safe-area-inset-top, 0px) + 16px); right: max(14px, env(safe-area-inset-right, 0px)); font-size: 13px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<a class="back" href="/" target="_top">← all games</a>

<div id="hud" class="hidden">
  <div class="board panel">
    <div class="stat"><div id="score">0</div><div class="label">Score</div></div>
    <div class="stat"><div id="best">0</div><div class="label">Best</div></div>
  </div>
</div>

<div id="hint" class="hidden"><span>Hold as you land, let go to spring</span><span class="kbd-only">or</span><kbd class="kbd-only">Space</kbd></div>

<div id="overlay" class="on">
  <div class="card show" id="startCard">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="4.6" r="2.2" fill="#fff"/><path d="M9 7.5v6.5M9 14l1.5 4M9 9.5l4.5 1.5M15 6v12M12.5 6h5M13 18h4M15 18l-1.6 1 3.2 1-3.2 1 1.6 1"/></svg></div>
    <h1 class="title">Pogo Hop</h1>
    <div class="keys"><kbd>Hold</kbd> to squash, let go to spring</div>
    <p class="tag">He never stops bouncing. Hold as you land to clear the gaps, and stick the centre for a perfect.</p>
    <div class="actions">
      <button class="btn primary" id="playBtn"><span>Play</span><kbd class="kbd-only">Space</kbd></button>
    </div>
    <div class="foot" id="startFoot"></div>
    <a class="exit" href="/" target="_top">← All games</a>
  </div>
  <div class="card" id="endCard">
    <div class="row">
      <div class="label">Round over</div>
      <span class="chip" id="endChip" style="display:none">New best</span>
    </div>
    <div class="result">
      <div><span id="endScore">0</span><div class="label">Points</div></div>
      <div><div id="endBest">0</div><div class="label">Best</div></div>
    </div>
    <div class="actions">
      <button class="btn primary" id="againBtn"><span>Play again</span><kbd class="kbd-only">Space</kbd></button>
      <button class="btn ghost" id="shareBtn" aria-label="Download image" title="Download image"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg></button>
    </div>
    <div class="foot" id="endFoot"></div>
    <a class="exit" href="/" target="_top">← All games</a>
  </div>
</div>
<div id="toast"></div>

<script>
const SLUG = 'pogo';
const GAME = 'Pogo Hop';
const COL = { bg: '#ffffff', ink: '#141414', fig: '#141414', muted: '#737373', faint: '#d4d4d4', butter: '#fde68a', accent: '#b45309', dot: 'rgba(31,41,55,0.13)' };
const cv = document.getElementById('c');
let ctx = cv.getContext('2d');

// Shared building blocks, copied from references/snippets.js. Keep what you use, delete the rest.

// ── Helpers ────────────────────────────────────────────────────────────────

const lerp = (a, b, k) => a + (b - a) * k;
const lerp2 = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const EASE = {
  io: (k) => (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2),
  in: (k) => k * k,
  out: (k) => 1 - (1 - k) * (1 - k),
  lin: (k) => k,
  soft: (k) => 0.5 - Math.cos(Math.PI * k) / 2,
};

function mulberry(a) {
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ── Fitting the world to any screen ────────────────────────────────────────
// Design the game in fixed world units (a VIEW box), then scale it to fit the screen, leaving room for the HUD.
// Draw with ctx.setTransform(dpr * cam.s, 0, 0, dpr * cam.s, dpr * cam.x, dpr * cam.y) and world coordinates.
// Portrait phones can't fit the whole width at a readable size, so they show at least minW world units
// centred on focusX (put the action there), and things off to the side scroll or roll into view.

const VIEW = { x0: -260, x1: 260, y0: -370, y1: 40, minW: 340, focusX: -60 };
let dpr = 1, cw = 0, ch = 0, cam = { s: 1, x: 0, y: 0 };

function fitView() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  cw = innerWidth;
  ch = innerHeight;
  const narrow = cw < ch;
  const top = narrow ? 150 : 110;
  const bottom = 64;
  const vw = VIEW.x1 - VIEW.x0, vh = VIEW.y1 - VIEW.y0;
  const fitH = (ch - top - bottom) / vh;
  const s = narrow ? Math.min(fitH, cw / VIEW.minW, 1.75) : Math.min((cw - 120) / vw, fitH, 1.75);
  const centre = narrow ? VIEW.focusX : (VIEW.x0 + VIEW.x1) / 2;
  cam = {
    s,
    x: cw / 2 - centre * s,
    y: top + (ch - top - bottom - vh * s) * (narrow ? 0.5 : 0.6) - VIEW.y0 * s,
  };
}
function toWorld(px, py) {
  return [(px - cam.x) / cam.s, (py - cam.y) / cam.s];
}

// ── Stick figure ───────────────────────────────────────────────────────────
// Poses are joint positions in figure space: facing right, feet near y = -8, head near y = -121.
// Draw at (x, groundY + 8) so the feet touch the ground. Needs: Helpers, strokePath, COL.fig.
// Make new poses with mk({...}) by moving a few joints of BASE; play them with an Actor.

const THIGH = 30, SHIN = 30, UARM = 21, FARM = 21;
const LIMB = 5, ARM = 4.2, TORSO = 8.5, HEAD_R = 7.8, FAR = '#9a9a9a';
const BASE = {
  face: 1,
  head: [0, -121], chest: [0, -96], hip: [0, -65],
  fF: [1, -8], fB: [-4, -8], kF: [22, -38], kB: [10, -38],
  hF: [3, -57], hB: [-1, -57], eF: [-6, -78], eB: [-6, -78],
};
const mk = (o, base = BASE) => Object.assign({}, base, o);
const P = {};
P.stand = mk({});
P.ready = mk({ head: [2, -121], hF: [15, -84], eF: [5, -71], hB: [-4, -56], eB: [-6, -77] });
P.crouch = mk({ head: [6, -100], chest: [4, -76], hip: [-2, -46], kF: [24, -30], kB: [12, -28], hF: [16, -60], eF: [10, -56], hB: [-8, -52], eB: [-8, -60] });
P.leap = mk({ head: [4, -124], chest: [2, -99], hip: [0, -68], fF: [14, -30], fB: [-14, -26], kF: [20, -52], kB: [-2, -48], hF: [18, -140], eF: [16, -120], hB: [-14, -134], eB: [-12, -116] });
P.cheer = mk({ head: [0, -122], chest: [0, -97], hip: [0, -67], hF: [16, -136], hB: [-12, -134], eF: [14, -118], eB: [-12, -116] });
P.wince = mk({ head: [-3, -118], chest: [-2, -94], hip: [0, -65], kF: [20, -37], hF: [7, -125], eF: [19, -111], hB: [-7, -125], eB: [-20, -109] });
P.phew = mk({ head: [-1, -120], chest: [-1, -95], hip: [0, -65], hF: [13, -80], eF: [4, -68], hB: [2, -122], eB: [-14, -106] });
P.punch = mk({ head: [8, -118], chest: [6, -94], hip: [0, -64], kF: [24, -36], kB: [-8, -34], fF: [18, -8], fB: [-16, -8], hF: [44, -98], eF: [26, -96], hB: [2, -88], eB: [-6, -78] });

const PTS = ['head', 'chest', 'hip', 'fF', 'fB', 'kF', 'kB', 'hF', 'hB', 'eF', 'eB'];

// Joints only bend the way real ones do, in the figure's own facing-right space (y down):
// an elbow folds the forearm toward the front of the body (ARM_BEND), a knee folds the shin back (KNEE_BEND).
// Pass the bend as the last argument; the hint then only matters when the limb is almost straight.
const ARM_BEND = -1, KNEE_BEND = 1;
function ik(a, b, l1, l2, hint, bend) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  let d = Math.hypot(dx, dy);
  const base = Math.atan2(dy, dx);
  // Ease into full extension so a straightening limb's joint doesn't race across the last few units.
  const L = l1 + l2, soft = L * 0.96;
  if (d > soft) {
    d = soft + (L - soft) * (1 - Math.exp(-(d - soft) / (L - soft)));
  }
  d = Math.max(Math.abs(l1 - l2) + 0.01, Math.min(L - 0.001, d));
  const c = Math.max(-1, Math.min(1, (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d)));
  const ang = Math.acos(c);
  const j1 = [a[0] + l1 * Math.cos(base + ang), a[1] + l1 * Math.sin(base + ang)];
  const j2 = [a[0] + l1 * Math.cos(base - ang), a[1] + l1 * Math.sin(base - ang)];
  if (bend) {
    const side = (j) => (j[0] - a[0]) * (b[1] - j[1]) - (j[1] - a[1]) * (b[0] - j[0]);
    return Math.sign(side(j1)) === bend ? j1 : j2;
  }
  const d1 = Math.hypot(j1[0] - hint[0], j1[1] - hint[1]);
  const d2 = Math.hypot(j2[0] - hint[0], j2[1] - hint[1]);
  return d1 < d2 ? j1 : j2;
}
function catmull(p0, p1, p2, p3, t) {
  const t2 = t * t, t3 = t2 * t;
  return 0.5 * (2 * p1 + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 + (-p0 + 3 * p1 - 3 * p2 + p3) * t3);
}
function pathPose(list, u) {
  const n = list.length - 1;
  const x = Math.min(n - 1e-6, Math.max(0, u * n));
  const i = Math.floor(x), t = x - i;
  const a = list[Math.max(0, i - 1)], b = list[i], c = list[i + 1], d = list[Math.min(n, i + 2)];
  const o = { face: lerp(b.face, c.face, t), hang: lerp(b.hang ?? 1, c.hang ?? 1, t) };
  for (const k of PTS) {
    o[k] = [catmull(a[k][0], b[k][0], c[k][0], d[k][0], t), catmull(a[k][1], b[k][1], c[k][1], d[k][1], t)];
  }
  return o;
}

// An Actor plays queued pose steps: actor.push({ pose: P.crouch, d: 0.12 }, { pose: P.leap, d: 0.2, ez: 'out' }).
// A step can also be { path: [P.a, P.b, P.c], d } for a smooth curve through several poses, or { fn: () => {} } to run code.
class Actor {
  constructor(pose) {
    this.pose = pose || P.ready;
    this.q = [];
    this.step = null;
    this.t = 0;
    this.id = Math.random().toString(36).slice(2);
  }
  push(...steps) {
    this.q.push(...steps);
  }
  clear() {
    this.q = [];
    this.step = null;
  }
  get idle() {
    return !this.step && !this.q.length;
  }
  update(dt) {
    for (let guard = 0; guard < 20; guard++) {
      if (!this.step) {
        if (!this.q.length) {
          return;
        }
        this.step = this.q.shift();
        this.t = 0;
        if (this.step.fn) {
          const fn = this.step.fn;
          this.step = null;
          fn();
          continue;
        }
        const targets = this.step.path || (this.step.pose ? [this.step.pose] : [this.pose]);
        this.step.list = [this.pose, ...targets];
      }
      this.t += dt;
      const s = this.step;
      const k = Math.min(1, this.t / s.d);
      this.pose = pathPose(s.list, (EASE[s.ez] || EASE.soft)(k));
      if (k < 1) {
        return;
      }
      dt = this.t - s.d;
      this.step = null;
    }
  }
}

// A back hand resting low under the shoulder hangs from a nearly straight arm, the way a relaxed arm does.
// Set hang: 0 on a pose when the back hand has to work there (it blends between poses like any number).
function relax(sh, t, amount) {
  const dx = t[0] - sh[0], dy = t[1] - sh[1];
  const d = Math.hypot(dx, dy);
  const want = (UARM + FARM) * 0.96;
  if (dy <= 0 || d < 1 || d >= want) {
    return t;
  }
  const w = (amount ?? 1) * Math.min(1, Math.max(0, (dy / d - 0.8) / 0.18));
  const k = w * w * (3 - 2 * w);
  const nd = d + (want - d) * k;
  return [sh[0] + (dx / d) * nd, sh[1] + (dy / d) * nd];
}
function reach(a, b, max) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const d = Math.hypot(dx, dy);
  if (d <= max) {
    return b;
  }
  return [a[0] + (dx / d) * max, a[1] + (dy / d) * max];
}
function breathe(p, amt) {
  if (!amt) {
    return p;
  }
  const o = Object.assign({}, p);
  const up = (v, k) => [v[0], v[1] - amt * k];
  o.head = up(p.head, 1);
  o.chest = up(p.chest, 0.85);
  o.hF = up(p.hF, 0.6);
  o.hB = up(p.hB, 0.6);
  return o;
}
const prevJ = {};
function mirrorJoint(a, b, j) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const L2 = dx * dx + dy * dy || 1;
  const t = ((j[0] - a[0]) * dx + (j[1] - a[1]) * dy) / L2;
  const px = a[0] + dx * t, py = a[1] + dy * t;
  return [2 * px - j[0], 2 * py - j[1]];
}
function ikC(key, a, b, l1, l2, hint, bend) {
  const j = ik(a, b, l1, l2, hint, bend);
  if (bend) {
    prevJ[key] = j;
    return j;
  }
  const pj = prevJ[key];
  if (pj) {
    const alt = mirrorJoint(a, b, j);
    const dj = Math.hypot(j[0] - pj[0], j[1] - pj[1]);
    const da = Math.hypot(alt[0] - pj[0], alt[1] - pj[1]);
    const dh = Math.hypot(j[0] - hint[0], j[1] - hint[1]) - Math.hypot(alt[0] - hint[0], alt[1] - hint[1]);
    if (da + 1.5 < dj && Math.abs(dh) < 4) {
      prevJ[key] = alt;
      return alt;
    }
  }
  prevJ[key] = j;
  return j;
}
// Figure styles: pick one for the whole game with FIG_STYLE, or per figure with opts.style.
// See references/figure-styles.png. Poses, props and pnpm game:motion work the same in every style.
//   classic      solid head, thick torso, grey far limbs: the house hero
//   doodle       big hollow round head with two line eyes on a thin, even stick body
//   doodleshirt  doodle in a shirt; opts.shirt sets the colour (team colours, goons in grey)
//   sketch       hollow wobbly head and thin pen lines that redraw a few times a second

let FIG_STYLE = 'classic';
const BODY = {

  doodleshirt: { head: 1.75, arm: 1, leg: 0.92, torso: 4.8, hollow: true, sameFar: true, eyes: true, shirt: true },
  sketch: { head: 1.6, arm: 0.78, leg: 0.74, torso: 3.6, hollow: true, sameFar: true, sketch: true },

let SK = null;

// opts: { flip: true } faces left, { ink, far } recolours (goons are drawn all grey), { scale } resizes,
// { style, shirt } pick the body (see FIG_STYLE), { lw } thickens every line (icons, share images),
// { rot, pivot } tips the whole body around a point in figure space (falls, rolls), { seed } varies sketch lines,

// J gives the joints in figure space: head (centre), hr (head radius), k (head scale for hats), chest, hip,

// ── Ink drawing ────────────────────────────────────────────────────────────
// Ground is a wobbly line at y = 0 in world space, never a filled floor.

// ── Popups, particles and shake ────────────────────────────────────────────
// popup('Perfect!', 'CHAIN ×2', true) over the action; burst() for hits; dust() for landings.

const popups = [];

// kick() on big moments; offset the camera by `shake` pixels in render().
function kick(amount) {

}
function updateFx(dt) {

    }
  }

    const b = bits[i];
    b.t += dt;
    b.vy += b.g * dt;
    b.vx *= 1 - Math.min(1, b.drag * dt);
    b.x += b.vx * dt;

    const y = p.y - 26 - 24 * EASE.out(Math.min(1, k * 1.3));
    const sc = 1 + 0.22 * Math.max(0, 1 - k * 5);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.font = "400 24px 'Balsamiq Sans', system-ui, sans-serif";
    let half = ctx.measureText(p.text).width / 2;
    if (p.sub) {
      ctx.font = "400 10px 'Balsamiq Sans', system-ui, sans-serif";
      half = Math.max(half, ctx.measureText(p.sub).width / 2 + p.sub.length * 0.75);
    }
    half = half * sc + 10;
    const x = right - left > half * 2 ? clamp(p.x, left + half, right - half) : (left + right) / 2;
    ctx.translate(x, y);
    ctx.scale(sc, sc);
    ctx.fillStyle = p.hot ? COL.accent : COL.ink;
    ctx.font = "400 24px 'Balsamiq Sans', system-ui, sans-serif";
    ctx.fillText(p.text, 0, 0);

// ── Sound ──────────────────────────────────────────────────────────────────
// Everything is synthesized. Call audio() inside the first tap/key handler (browsers block sound before that).

      bus.connect(comp);
      const len = Math.floor(actx.sampleRate * 1.1);

      for (let c = 0; c < 2; c++) {
        const d = ir.getChannelData(c);
        for (let i = 0; i < len; i++) {

        }

      const conv = actx.createConvolver();
      conv.buffer = ir;
      verb = actx.createGain();

// A starter set; tune pitches and volumes to the game.

  },
  record() {
    [523, 659, 784, 1047].forEach((f, i) => {
      partial(f, f, 0.32, 0.05, 'triangle', 0.45, 0.1 + i * 0.075);
    });
  },
  lose() {
    partial(220, 90, 0.5, 0.25, 'triangle', 0.3);
    hiss(0.3, 0.1, 'lowpass', 900, 200, 0.7, 0.3);
  },
};

// ── Test modes ─────────────────────────────────────────────────────────────
// ?bot plays by itself like a decent first-timer (reaction delay + aim error), so `pnpm game:check --bot` can
// measure how long a run lasts and grab a mid-game social image. Set window.__bot = true when it's on.
// Never save stats in a test mode.

const Q = new URLSearchParams(location.search);
const BOT = Q.has('bot');
const TEST = BOT || Q.has('still') || Q.has('autoplay');
window.__bot = BOT;

function gauss(r) {
  return (r() + r() + r() - 1.5) / 1.5;
}

// ── Pogo Hop ───────────────────────────────────────────────────────────────
// The figure never stops bouncing. Every touchdown is a choice: let it go for a little hop,
// or hold to squash the spring deeper and let go to fly over the gap.

const G = 1800;
const VX = 170;
const VY_MIN = 360;
const VY_MAX = 980;
const HOLD_MAX = 0.5;
const SQUASH_MIN = 0.07;
const SPRING = 30;
const FIG_VX = -150;
let vx = VX;

const $ = (id) => document.getElementById(id);
window.__freeze = Q.has('still');

const store = {
  get(k, d) {
    try {
      const v = localStorage.getItem(SLUG + '.' + k);
      return v === null ? d : JSON.parse(v);
    } catch (e) {
      return d;
    }
  },
  set(k, v) {
    if (TEST) {
      return;
    }
    try {
      localStorage.setItem(SLUG + '.' + k, JSON.stringify(v));
    } catch (e) {
      return;
    }
  },
};
const life = Object.assign({ best: 0, games: 0, bounces: 0, perfects: 0, bestChain: 0, seenHint: false }, TEST ? {} : store.get('life', {}));

function resize() {
  fitView();
  cv.width = Math.round(cw * dpr);
  cv.height = Math.round(ch * dpr);
}
addEventListener('resize', resize);
resize();

// Poses on the pogo: feet on the pegs, both hands on the handlebar at y = -70.
P.pogo = mk({ head: [3, -121], chest: [2, -96], hip: [0, -65], fF: [9, -8], fB: [4, -8], kF: [22, -38], kB: [17, -37], hF: [24, -60], hB: [18, -60], eF: [12, -80], eB: [8, -80], hang: 0 });
P.pogoSquash = mk({ head: [10, -116], chest: [7, -92], hip: [-1, -61], fF: [9, -8], fB: [4, -8], kF: [24, -34], kB: [19, -33], hF: [24, -60], hB: [18, -60], eF: [16, -76], eB: [12, -76], hang: 0 });
P.pogoStretch = mk({ head: [1, -124], chest: [1, -99], hip: [0, -68], fF: [9, -8], fB: [4, -8], kF: [18, -39], kB: [13, -39], hF: [24, -60], hB: [18, -60], eF: [11, -82], eB: [7, -82], hang: 0 });
P.flail = mk({ head: [-2, -119], chest: [-1, -95], hip: [0, -65], fF: [16, -14], fB: [-10, -12], kF: [22, -40], kB: [2, -38], hF: [18, -128], eF: [16, -110], hB: [-6, -128], eB: [-14, -110] });

function blendPose(a, b, k) {
  const o = { face: 1, hang: lerp(a.hang ?? 1, b.hang ?? 1, k) };
  for (const key of PTS) {
    o[key] = lerp2(a[key], b[key], k);
  }
  return o;
}

let mode = 'menu';
let clock = 0, runTime = 0;
const me = new Actor(P.pogo);
const rig = { x: -60, y: 0, vy: 0, state: 'ground', gT: 0, charge: 0, charging: false, imp: 0, comp: 0, rot: 0, vrot: 0, vx: 0, on: null };
let pillars = [];
let pillarCount = 0;
let holding = false;
let score = 0, chain = 0, bestChain = 0, perfects = 0, lastIdx = 0, lastResult = null;
const cam2 = { x: -60, y: 0 };
let poseK = 0, poseLift = 0;

function pillarRng() {
  return Math.random();
}

function maxReach(h) {
  // Horizontal distance a full-power bounce covers when the landing is h lower (h < 0 is higher).
  const disc = VY_MAX * VY_MAX + 2 * G * h;
  if (disc < 0) {
    return 0;
  }
  return vx * ((VY_MAX + Math.sqrt(disc)) / G);
}

function addPillar() {
  const prev = pillars[pillars.length - 1];
  const i = ++pillarCount;
  const d = clamp((i - 2) / 30, 0, 1.5);
  const r = pillarRng;
  const w = Math.max(lerp(38, 28, clamp(d - 1, 0, 0.5) * 2), lerp(120, 52, d) * (0.75 + r() * 0.5));
  let top = prev.top + (r() - 0.5) * lerp(40, 150, d);
  top = clamp(top, -150, 150);
  const h = top - prev.top;
  let gap = lerp(40, 120, d) * (0.6 + r() * 0.8);
  const maxD = maxReach(h) * 0.82;
  gap = clamp(gap, 24, Math.max(24, maxD - 12 - w / 2));
  const crumble = i > 8 && r() < clamp(lerp(0.12, 0.35, d), 0, 0.45);
  pillars.push({ i, left: prev.left + prev.w + gap, w, top, crumble, fallAt: 0, fy: 0, fv: 0, flash: 0 });
}

function startGame() {
  audio();
  mode = 'play';
  score = 0;
  chain = 0;
  bestChain = 0;
  perfects = 0;
  lastIdx = 0;
  runTime = 0;
  vx = VX;
  pillarCount = 0;
  pillars = [{ i: 0, left: -170, w: 430, top: 0, crumble: false, fallAt: 0, fy: 0, fv: 0, flash: 0 }];
  for (let k = 0; k < 6; k++) {
    addPillar();
  }
  Object.assign(rig, { x: -110, y: 0, vy: 0, state: 'ground', gT: 0, charge: 0, charging: false, imp: 0, comp: 0, rot: 0, vrot: 0, vx: 0, on: pillars[0] });
  cam2.x = rig.x;
  cam2.y = 0;
  holding = false;
  me.clear();
  me.pose = P.pogo;
  botPlan = null;
  $('overlay').classList.remove('on');
  $('hud').classList.remove('hidden');
  $('hint').classList.toggle('hidden', life.seenHint || BOT);
  updateHud();
}

function endGame() {
  mode = 'over';
  SND.lose();
  buzz(40);
  life.games++;
  const isBest = score > life.best;
  life.best = Math.max(life.best, score);
  life.bestChain = Math.max(life.bestChain, bestChain);
  store.set('life', life);
  lastResult = { score, isBest, chain: bestChain, pillars: lastIdx, time: runTime };
  window.__lastRun = lastResult;
  setTimeout(() => {
    $('endScore').textContent = score;
    $('endBest').textContent = life.best;
    $('endChip').style.display = isBest && score > 0 ? '' : 'none';
    $('endFoot').innerHTML = lifetimeLine();
    $('startCard').classList.remove('show');
    $('endCard').classList.add('show');
    $('overlay').classList.add('on');
    $('hud').classList.add('hidden');
    $('hint').classList.add('hidden');
  }, 650);
}

function lifetimeLine() {
  if (!life.games) {
    return '';
  }
  return `Best ${life.best} · longest perfect chain ${life.bestChain}<br>${life.games} ${life.games === 1 ? 'game' : 'games'} · ${life.bounces.toLocaleString()} boings`;
}

function updateHud() {
  const el = $('score');
  if (el.textContent !== String(score)) {
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
  }
  el.textContent = score;
  $('best').textContent = Math.max(life.best, score);
}

// ── Input: one button, held or not ─────────────────────────────────────────

function press() {
  audio();
  if (mode !== 'play') {
    return;
  }
  holding = true;
}
function release() {
  holding = false;
}
cv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  press();
});
addEventListener('pointerup', release);
addEventListener('pointercancel', release);
addEventListener('blur', release);
const KEYS = ['Space', 'Enter', 'ArrowUp'];
addEventListener('keydown', (e) => {
  if (!KEYS.includes(e.code)) {
    return;
  }
  e.preventDefault();
  if (e.repeat) {
    return;
  }
  if (mode !== 'play') {
    if (mode === 'over' && !$('overlay').classList.contains('on')) {
      return;
    }
    startGame();
    return;
  }
  press();
});
addEventListener('keyup', (e) => {
  if (KEYS.includes(e.code)) {
    release();
  }
});
addEventListener('contextmenu', (e) => e.preventDefault());
$('playBtn').addEventListener('click', startGame);
$('againBtn').addEventListener('click', startGame);
$('shareBtn').addEventListener('click', () => share(lastResult));

// ── Sounds ─────────────────────────────────────────────────────────────────

function boing(power) {
  const f0 = 150 + power * 60, f1 = 330 + power * 380;
  partial(f0, f1, 0.18 + power * 0.22, 0.12 + power * 0.1, 'sine', 0.15);
  partial(f0 * 1.5, f1 * 1.5, 0.12 + power * 0.15, 0.03 + power * 0.03, 'triangle', 0.2);
  hiss(0.06, 0.05, 'bandpass', 2400, 1200, 2, 0.1);
}
function creak(k) {
  partial(90 + k * 70, 80 + k * 70, 0.05, 0.04, 'sawtooth', 0.05);
}

// ── Bounce physics ─────────────────────────────────────────────────────────

function launch(c) {
  const power = clamp(c, 0, 1);
  rig.vy = -lerp(VY_MIN, VY_MAX, power);
  rig.state = 'air';
  rig.on = null;
  life.bounces++;
  boing(power);
  if (power > 0.35) {
    dust(rig.x, rig.y, 24, 6);
    if (!life.seenHint && !BOT) {
      life.seenHint = true;
      store.set('life', life);
      $('hint').classList.add('hidden');
    }
  }
}

function land(p) {
  rig.y = p.top + p.fy;
  rig.state = 'ground';
  rig.on = p;
  rig.gT = 0;
  rig.charge = 0;
  rig.charging = false;
  rig.imp = clamp(rig.vy / 110, 3, 9);
  rig.vy = 0;
  SND.tok(0.7);
  dust(rig.x, rig.y, 18, 4);
  const centre = p.left + p.w / 2;
  if (p.i > lastIdx) {
    let pts = p.i - lastIdx;
    lastIdx = p.i;
    const off = Math.abs(rig.x - centre);
    if (off < 7) {
      chain++;
      perfects++;
      life.perfects++;
      bestChain = Math.max(bestChain, chain);
      pts += chain >= 3 ? 2 : 1;
      p.flash = 1;
      popup('Perfect!', chain >= 2 ? `CHAIN ×${chain}` : '', true, centre, p.top - 120);
      SND.perfect();
      if (chain >= 3) {
        SND.streak(chain);
      }
      kick(40);
    } else {
      chain = 0;
      if (rig.x < p.left + 5 || rig.x > p.left + p.w - 5) {
        popup('Close!', '', false, rig.x, p.top - 120);
        rig.vrot = rig.x < p.left + 5 ? -3 : 3;
      }
    }
    score += pts;
    updateHud();
    while (pillarCount < p.i + 6) {
      addPillar();
    }
    if (p.crumble) {
      p.fallAt = clock + 0.55;
    }
  } else if (p.crumble && !p.fallAt) {
    p.fallAt = clock + 0.55;
  }
}

function fall(push) {
  if (rig.state === 'fall') {
    return;
  }
  rig.state = 'fall';
  rig.on = null;
  rig.vx = push;
  rig.vrot = push < 0 ? -5 : 4;
  me.clear();
  me.push({ pose: P.flail, d: 0.22, ez: 'out' });
  partial(520, 160, 0.6, 0.08, 'triangle', 0.3);
  kick(80);
  buzz(30);
  chain = 0;
}

// ── Bot: a decent first-timer with a little timing slop ────────────────────

const botRng = mulberry(7);
let botPlan = null;
function nextPillar(x) {
  return pillars.find((p) => p.left > x && p.fy < 5);
}
function bot() {
  if (rig.state === 'air') {
    // Hold through the landing whenever the plan for the next bounce is a big one.
    botPlan = null;
    return;
  }
  if (rig.state !== 'ground') {
    holding = false;
    return;
  }
  if (!botPlan) {
    const p = rig.on;
    const n = nextPillar(rig.x);
    const tSmall = (2 * VY_MIN) / G;
    const after = rig.x + vx * tSmall;
    const safe = p && !p.crumble && after < p.left + p.w - 6;
    if (safe || !n) {
      botPlan = { hold: 0, react: 0 };
    } else {
      const D = n.left + n.w / 2 + gauss(botRng) * 9 - rig.x;
      const h = n.top - p.top;
      const t = D / vx;
      const vy = (G * t * t) / 2 - h;
      const c = clamp((vy / t - VY_MIN) / (VY_MAX - VY_MIN), 0, 1);
      botPlan = { hold: Math.max(0.03, c * HOLD_MAX + gauss(botRng) * 0.03), react: botRng() * 0.04 };
    }
  }
  holding = botPlan.hold > 0 && rig.gT >= botPlan.react && rig.gT < botPlan.react + botPlan.hold;
  if (botPlan.hold > 0 && rig.gT >= botPlan.react + botPlan.hold) {
    holding = false;
  }
}

// ── Update ─────────────────────────────────────────────────────────────────

function update(dt) {
  clock += dt;
  updateFx(dt);
  for (const p of pillars) {
    p.flash = Math.max(0, p.flash - dt * 1.5);
    if (p.fallAt && clock > p.fallAt) {
      if (!p.fv) {
        hiss(0.4, 0.12, 'lowpass', 700, 150, 0.7, 0.2);
        burst(p.left + p.w / 2, p.top, 10);
      }
      p.fv += G * 0.6 * dt;
      p.fy += p.fv * dt;
    }
  }
  if (mode === 'menu') {
    menuBounce(dt);
    return;
  }
  if (mode !== 'play' && rig.state !== 'fall') {
    return;
  }
  if (mode === 'play') {
    runTime += dt;
    vx = VX * (1 + Math.min(0.7, runTime / 200));
    if (BOT) {
      bot();
    }
  }
  const prevX = rig.x, prevY = rig.y;
  if (rig.state === 'ground') {
    const p = rig.on;
    rig.y = p.top + p.fy;
    rig.gT += dt;
    if (p.fv > 0) {
      fall(30);
    } else if (holding) {
      rig.charging = true;
      const was = rig.charge;
      rig.charge = Math.min(1, rig.charge + dt / HOLD_MAX);
      if (Math.floor(was * 6) !== Math.floor(rig.charge * 6)) {
        creak(rig.charge);
      }
    } else if (rig.charging || rig.gT >= SQUASH_MIN) {
      launch(rig.charging ? rig.charge : 0);
    }
  } else if (rig.state === 'air') {
    rig.vy += G * dt;
    rig.x += vx * dt;
    rig.y += rig.vy * dt;
    for (const p of pillars) {
      if (p.fy > 20) {
        continue;
      }
      const top = p.top + p.fy;
      if (rig.vy > 0 && prevY <= top && rig.y >= top && rig.x >= p.left - 2 && rig.x <= p.left + p.w + 2) {
        land(p);
        break;
      }
      if (prevX < p.left && rig.x >= p.left && rig.y > top + 3) {
        rig.x = p.left - 1;
        SND.thunk(0.6);
        burst(p.left, rig.y - 40, 8);
        fall(-60);
        break;
      }
    }
  } else if (rig.state === 'fall') {
    rig.vy += G * dt;
    rig.x += rig.vx * dt;
    rig.y += rig.vy * dt;
    rig.rot += rig.vrot * dt;
    if (mode === 'play' && rig.y > cam2.y + 420) {
      endGame();
    }
  }
  if (rig.state !== 'fall') {
    rig.rot = lerp(rig.rot, rig.state === 'air' ? clamp(rig.vy / 4000, -0.1, 0.12) : 0, Math.min(1, dt * 10));
    rig.rot += rig.vrot * dt * 0.02;
    rig.vrot *= 1 - Math.min(1, dt * 4);
  }
  rig.imp = Math.max(0, rig.imp - dt * 40);
  const want = rig.state === 'ground' ? Math.max(rig.imp, rig.charge * 21) : 0;
  rig.comp = lerp(rig.comp, want, Math.min(1, dt * (want > rig.comp ? 30 : 22)));
  poseFor(dt);
  // Camera: follow along, keep the pillar you are on near the bottom, look up on big bounces.
  cam2.x = lerp(cam2.x, rig.x, Math.min(1, dt * 7));
  if (rig.state !== 'fall') {
    const p = rig.on || pillars.find((q) => q.i === lastIdx) || pillars[0];
    cam2.y = lerp(cam2.y, p.top, Math.min(1, dt * 3));
    if (rig.y - cam2.y < -200) {
      cam2.y = rig.y + 200;
    }
  }
  pillars = pillars.filter((p) => p.left + p.w > cam2.x - 600 && p.fy < 900);
}

function poseFor(dt) {
  if (rig.state === 'fall') {
    me.update(dt);
    return;
  }
  const k = clamp(rig.comp / 21, 0, 1);
  const lift = rig.state === 'air' ? clamp(-rig.vy / VY_MAX, 0, 1) : 0;
  poseK = lerp(poseK, k, Math.min(1, dt * 18));
  poseLift = lerp(poseLift, lift, Math.min(1, dt * 8));
  const base = blendPose(P.pogo, P.pogoStretch, poseLift);
  me.pose = blendPose(base, P.pogoSquash, poseK);
}

// The start screen: he bounces in place, a big boing every few hops.
let menuT = 0;
function menuBounce(dt) {
  menuT += dt;
  if (rig.state === 'ground') {
    rig.gT += dt;
    if (rig.gT > 0.09) {
      rig.vy = -(Math.floor(menuT * 2) % 5 === 0 ? 560 : 330);
      rig.state = 'air';
    }
  } else {
    rig.vy += G * dt;
    rig.y += rig.vy * dt;
    if (rig.y >= 0) {
      rig.y = 0;
      rig.imp = clamp(rig.vy / 110, 3, 9);
      rig.vy = 0;
      rig.state = 'ground';
      rig.gT = 0;
    }
  }
  rig.imp = Math.max(0, rig.imp - dt * 40);
  rig.comp = lerp(rig.comp, rig.state === 'ground' ? rig.imp : 0, Math.min(1, dt * 26));
  rig.charge = 0;
  poseFor(dt);
}

// ── Drawing ────────────────────────────────────────────────────────────────

function drawSpring(top, bottom) {
  ctx.strokeStyle = COL.ink;
  ctx.lineWidth = 1.8;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  const coils = 6, len = bottom - top;
  ctx.beginPath();
  ctx.moveTo(0, top);
  for (let i = 0; i <= coils * 2; i++) {
    const y = top + (len * i) / (coils * 2);
    ctx.lineTo(i === 0 || i === coils * 2 ? 0 : i % 2 ? 5 : -5, y);
  }
  ctx.stroke();
}

// The pogo stick with the figure on it. Tip at (x, y); comp squashes the spring.
function drawRig(a, x, y, comp, rot, opts) {
  const o = opts || {};
  const springLen = SPRING - comp;
  const peg = -(6 + springLen);
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  // Rubber tip, spring, shaft up to the handlebar.
  roundRect(-3.5, -7, 7, 7, 2.5);
  inkShape('#4b4b4b', 1.4);
  drawSpring(peg + 2, -6);
  inkBar(0, peg - 2, 0, peg - 52, 3.2, '#ffffff');
  inkBar(-10, peg - 52, 13, peg - 52, 3.6, COL.butter);
  inkBar(-12, peg, 8, peg, 2.6, '#ffffff');
  drawFigure(a, -14, peg + 8, 0, { live: o.live, lw: o.lw });
  ctx.restore();
}

function drawPillar(p, bottom) {
  const x = p.left, w = p.w, top = p.top + p.fy;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(x, bottom);
  ctx.lineTo(x, top + 4);
  ctx.quadraticCurveTo(x, top, x + 4, top);
  ctx.lineTo(x + w - 4, top);
  ctx.quadraticCurveTo(x + w, top, x + w, top + 4);
  ctx.lineTo(x + w, bottom);
  inkShape(p.flash > 0 ? `rgba(253,230,138,${p.flash})` : '#ffffff', 2);
  // Bricks: a few short ink marks, fewer as you go down.
  ctx.strokeStyle = p.crumble ? '#8d8d8d' : COL.faint;
  ctx.lineWidth = 1.3;
  const rnd = mulberry(p.i * 31 + 5);
  for (let row = 0; row < 7; row++) {
    const yy = top + 18 + row * 22;
    for (let c = 0; c < Math.ceil(w / 26); c++) {
      if (rnd() < 0.45) {
        const xx = x + 6 + rnd() * (w - 20);
        line(xx, yy, xx + 8 + rnd() * 8, yy);
      }
    }
  }
  if (p.crumble) {
    ctx.strokeStyle = COL.ink;
    ctx.lineWidth = 1.4;
    const cx = x + w * (0.3 + rnd() * 0.4);
    ctx.beginPath();
    ctx.moveTo(cx, top);
    ctx.lineTo(cx - 4, top + 9);
    ctx.lineTo(cx + 3, top + 16);
    ctx.lineTo(cx - 2, top + 26);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x + w * 0.8, top);
    ctx.lineTo(x + w * 0.8 + 4, top + 8);
    ctx.stroke();
  }
  // A small centre tick, the perfect spot.
  ctx.strokeStyle = p.flash > 0 ? COL.accent : '#bdbdbd';
  ctx.lineWidth = 2;
  line(x + w / 2, top - 4, x + w / 2, top + 3);
  ctx.restore();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.setTransform(dpr * cam.s, 0, 0, dpr * cam.s, dpr * cam.x, dpr * (cam.y + shake));
  const vl = toWorld(0, 0)[0], vr = toWorld(cw, 0)[0];
  const bottomView = toWorld(0, ch)[1] + 20;
  if (mode === 'menu') {
    drawGround(vl - 20, vr + 20);
    contactShadow(FIG_VX, 12, 0.1);
    drawRig(me, FIG_VX, rig.y, rig.comp, 0);
    drawBits();
    return;
  }
  ctx.save();
  ctx.translate(FIG_VX - cam2.x, -cam2.y);
  const wl = vl - FIG_VX + cam2.x, wr = vr - FIG_VX + cam2.x;
  const bottom = bottomView + cam2.y;
  for (const p of pillars) {
    if (p.left + p.w > wl - 10 && p.left < wr + 10) {
      drawPillar(p, bottom + 40);
    }
  }
  if (rig.state === 'air' || rig.state === 'ground') {
    const under = pillars.find((p) => rig.x >= p.left && rig.x <= p.left + p.w && p.fy < 20);
    if (under && under.top >= rig.y - 1) {
      const gap = under.top - rig.y;
      contactShadow(rig.x, Math.max(5, 12 - gap * 0.03), Math.max(0.03, 0.12 - gap * 0.0004), under.top);
    }
  }
  drawRig(me, rig.x, rig.y, rig.comp, rig.rot);
  drawBits();
  drawPopups(wl, wr);
  ctx.restore();
}

// ── Share image ────────────────────────────────────────────────────────────

function shareCanvas(res) {
  const SW = 1080, SH = 1350;
  const c = document.createElement('canvas');
  c.width = SW;
  c.height = SH;
  const prev = ctx;
  ctx = c.getContext('2d');
  const font = (s) => `400 ${s}px 'Balsamiq Sans', system-ui, sans-serif`;
  ctx.fillStyle = COL.bg;
  ctx.fillRect(0, 0, SW, SH);
  ctx.fillStyle = COL.dot;
  for (let y = 18; y < SH; y += 36) {
    for (let x = 18; x < SW; x += 36) {
      ctx.beginPath();
      ctx.arc(x, y, 1.6, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  if (res.isBest) {
    ctx.fillStyle = COL.accent;
    ctx.font = font(30);
    ctx.letterSpacing = '4px';
    ctx.fillText('PERSONAL BEST', 82, 108);
  }
  ctx.fillStyle = COL.ink;
  ctx.font = font(250);
  ctx.letterSpacing = '-4px';
  ctx.fillText(String(res.score), 70, 330);
  ctx.letterSpacing = '4px';
  ctx.fillStyle = COL.muted;
  ctx.font = font(30);
  ctx.fillText('POINTS', 82, 386);
  ctx.letterSpacing = '0px';
  const stats = [[res.pillars, 'PILLARS'], [res.chain, 'PERFECT CHAIN']];
  stats.forEach(([v, l], i) => {
    ctx.fillStyle = COL.ink;
    ctx.font = font(64);
    ctx.letterSpacing = '0px';
    ctx.fillText(String(v), 82, 560 + i * 150);
    ctx.fillStyle = COL.muted;
    ctx.font = font(21);
    ctx.letterSpacing = '3px';
    ctx.fillText(l, 84, 600 + i * 150);
  });
  ctx.fillStyle = COL.faint;
  ctx.font = font(26);
  ctx.fillText(GAME.toUpperCase(), 84, 1196);
  ctx.letterSpacing = '0px';
  ctx.save();
  ctx.translate(790, 1330);
  ctx.scale(2.3, 2.3);
  drawPillar({ i: 3, left: -60, w: 120, top: -60, fy: 0, flash: 0, crumble: false }, 40);
  drawRig({ pose: P.pogoStretch }, 4, -250, 0, 0.06, { live: false });
  ctx.restore();
  ctx = prev;
  return c;
}

let toastTimer = 0;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 2400);
}

async function share(res) {
  if (!res) {
    return;
  }
  try {
    await document.fonts.ready;
    const blob = await new Promise((r) => shareCanvas(res).toBlob(r, 'image/png'));
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${SLUG}-${res.score}.png`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast('Image saved');
  } catch (e) {
    toast('Could not save the image');
  }
}

$('startFoot').innerHTML = lifetimeLine();
if (Q.has('autoplay') || BOT) {
  startGame();
}

let last = performance.now();
function frame(now) {
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
  last = now;
  if (!window.__freeze) {
    update(dt);
  }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
