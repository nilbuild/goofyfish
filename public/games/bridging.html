<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-visual">
<title>Keep Bridging</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #ffffff;
    --card: #ffffff;
    --ink: #1f2329;
    --muted: #7a7a7a;
    --soft: #a3a3a3;
    --faint: #d4d4d4;
    --line: #ededed;
    --dot: rgba(31, 41, 55, .13);
    --chip: #f5f5f5;
    --ring: rgba(0, 0, 0, .06);
    --butter: #fde68a;
    --butter-hi: #fcd34d;
    --butter-soft: #fef3c7;
    --umber: #78350f;
    --amber: #b45309;
    --font: 'Balsamiq Sans', 'Comic Sans MS', ui-rounded, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; color: var(--ink); overflow: hidden;
    background-color: var(--paper);
    background-image: radial-gradient(circle, var(--dot) 0.8px, transparent 1px);
    background-size: 24px 24px; background-position: 12px 12px;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
    font-family: var(--font); font-weight: 400;
  }
  h1, b, strong { font-weight: 400; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: text; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; outline: none; padding: 0; }
  .panel { background: var(--card); border-radius: 14px; box-shadow: 0 0 0 1px var(--ring), 0 2px 8px rgba(0, 0, 0, .04), 0 1px 2px rgba(0, 0, 0, .03); }
  .label { font-size: 13px; color: var(--muted); line-height: 1.2; }

  #ti { position: fixed; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; font-size: 16px; pointer-events: none; caret-color: transparent; }

  #hud {
    position: fixed; left: 0; top: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 20px) 0 0 max(20px, env(safe-area-inset-left, 0px));
    pointer-events: none; transition: opacity .35s ease;
  }
  #hud.hidden { opacity: 0; }
  .board { padding: 14px 18px; display: flex; align-items: flex-end; gap: 24px; }
  .stat .label { margin-top: 6px; }
  #score { font-size: 44px; line-height: .85; font-variant-numeric: tabular-nums; display: inline-block; transform-origin: left bottom; }
  #score.bump { animation: bump .35s ease; }
  @keyframes bump { 0% { transform: scale(1); } 35% { transform: scale(1.12); } 100% { transform: scale(1); } }
  .small { font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--muted); }

  #hint {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); transform: translateX(-50%);
    font-size: 14.5px; color: var(--muted); white-space: nowrap; pointer-events: none; transition: opacity .4s;
    display: flex; align-items: center; gap: 8px;
  }
  #hint.hidden { opacity: 0; }
  kbd { font: inherit; font-size: 12px; color: #5a5a5a; background: var(--chip); box-shadow: 0 0 0 1px rgba(0, 0, 0, .07); border-radius: 6px; padding: 3px 8px; line-height: 1.25; }
  @media (hover: none) { .kbd-only { display: none; } }

  #overlay {
    position: fixed; inset: 0; display: grid; place-items: center; padding: 20px;
    background: rgba(255, 255, 255, .6);
    opacity: 0; pointer-events: none; transition: opacity .3s ease; overflow-y: auto;
  }
  #overlay.on { opacity: 1; pointer-events: auto; }
  .card {
    width: min(380px, 100%); background: var(--card); border-radius: 18px; padding: 28px;
    box-shadow: 0 0 0 1px var(--ring), 0 16px 40px -14px rgba(0, 0, 0, .16), 0 1px 2px rgba(0, 0, 0, .04);
    transform: translateY(12px); transition: transform .35s cubic-bezier(.2, .9, .3, 1); display: none;
  }
  #overlay.on .card.show { transform: none; }
  .card.show { display: block; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .logo { width: 46px; height: 46px; border-radius: 12px; background: #262626; display: grid; place-items: center; margin-bottom: 20px; }
  .logo svg { width: 28px; height: 28px; }
  .title { font-size: 32px; line-height: 1; margin: 0; }
  .keys { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--muted); font-size: 15px; margin: 18px 0 10px; }
  .tag { color: var(--muted); font-size: 15px; line-height: 1.5; margin: 0 0 20px; }
  .chip { display: inline-flex; align-items: center; gap: 3px; font-size: 13px; padding: 3px 9px; border-radius: 7px; background: var(--butter); color: var(--umber); white-space: nowrap; }
  .actions { display: flex; gap: 10px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 10px; height: 50px; border-radius: 12px; font-size: 17px; transition: transform .12s, background .2s; }
  .btn:active { transform: scale(.98); }
  .btn.primary { flex: 1; background: var(--butter); color: var(--umber); box-shadow: 0 0 0 1px rgba(180, 83, 9, .2), 0 2px 8px rgba(0, 0, 0, .04); }
  .btn.primary kbd { background: rgba(255, 255, 255, .55); color: #92400e; box-shadow: none; }
  .btn.ghost { width: 50px; flex: none; background: var(--chip); box-shadow: 0 0 0 1px rgba(0, 0, 0, .05); }
  @media (hover: hover) {
    .btn.primary:hover { background: var(--butter-hi); }
    .btn.ghost:hover { background: #ececec; }
    .lv:not(:disabled):hover { background: var(--chip); }
  }
  .btn svg { width: 19px; height: 19px; }
  .foot { text-align: center; color: var(--soft); font-size: 13px; line-height: 1.5; margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); }
  .foot:empty { display: none; }
  .result { display: flex; align-items: flex-end; gap: 32px; margin: 22px 0 28px; }
  .result .label { margin-top: 8px; }
  #endScore { font-size: 72px; line-height: .8; font-variant-numeric: tabular-nums; display: block; }
  #endBest { font-size: 32px; line-height: .9; font-variant-numeric: tabular-nums; }

  .card.wide { width: min(560px, 100%); }
  .head { display: flex; align-items: center; gap: 14px; }
  .head .logo { margin: 0; flex: none; }
  .sub { color: var(--muted); font-size: 15px; margin-top: 6px; }
  .parts { display: flex; flex-direction: column; gap: 7px; margin: 24px 0 14px; }
  .prow { display: grid; grid-template-columns: 112px repeat(5, 1fr); gap: 7px; align-items: center; }
  .pname { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .lv {
    position: relative; height: 46px; border-radius: 10px; background: var(--card); box-shadow: 0 0 0 1px rgba(0, 0, 0, .09);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 16px; line-height: 1;
    transition: background .15s, box-shadow .15s;
  }
  .lv small { font-size: 10px; color: var(--muted); min-height: 10px; font-variant-numeric: tabular-nums; }
  .lv.done { background: #fafafa; }
  .lv.sel { background: var(--butter-soft); box-shadow: 0 0 0 2px var(--butter-hi); color: var(--umber); }
  .lv.sel small { color: #92400e; }
  .lv .hat { position: absolute; top: 5px; right: 5px; width: 11px; height: 11px; }
  .lv .hat path { fill: var(--butter-hi); stroke: var(--ink); stroke-width: 1.3; stroke-linejoin: round; }
  .lv .flag { position: absolute; top: 5px; left: 6px; width: 10px; height: 11px; }
  .lv .flag path { fill: none; stroke: #9a9a9a; stroke-width: 1.4; stroke-linejoin: round; stroke-linecap: round; }
  .lv.sel .flag path { stroke: #92400e; }
  .endless {
    width: 100%; height: 46px; border-radius: 10px; box-shadow: 0 0 0 1px rgba(0, 0, 0, .09); margin: 0 0 16px;
    display: flex; align-items: center; justify-content: space-between; padding: 0 14px; font-size: 15px;
  }
  .endless .label { font-size: 13px; }
  .endless.sel { background: var(--butter-soft); box-shadow: 0 0 0 2px var(--butter-hi); color: var(--umber); }
  .nokb { display: none; text-align: center; padding: 18px 8px 6px; }
  .nokb svg { width: 64px; height: 40px; margin-bottom: 12px; }
  .nokb p { font-size: 17px; margin: 0 0 6px; }
  .nokb .label { font-size: 14px; margin-bottom: 20px; }
  .nokb a { display: inline-flex; text-decoration: none; padding: 0 32px; }
  body.phone .nokb { display: block; }
  body.phone #levels, body.phone .endless, body.phone .lvname, body.phone #startCard .actions, body.phone #startFoot { display: none; }
  .lvname { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 0 2px 12px; min-height: 20px; }
  .lvname b { font-size: 17px; }
  .lvname span { font-size: 13px; color: var(--muted); text-align: right; }
  @media (max-width: 520px) {
    .prow { grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .pname { display: none; }
    .parts { gap: 6px; margin-top: 20px; }
  }

  #toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translate(-50%, 20px);
    background: #262626; color: #fff; font-size: 14px; padding: 10px 16px; border-radius: 10px;
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; white-space: nowrap; z-index: 5;
  }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  .back { position: fixed; z-index: 6; top: calc(env(safe-area-inset-top, 0px) + 22px); right: max(20px, env(safe-area-inset-right, 0px)); font-size: 14px; color: var(--soft); text-decoration: none; }
  .back:hover { color: var(--ink); }
  @media (max-width: 420px) {
    #hud { padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-top: calc(env(safe-area-inset-top, 0px) + 14px); }
    .board { padding: 12px 14px; gap: 18px; }
    #score { font-size: 38px; }
    .small { font-size: 19px; }
    .back { top: calc(env(safe-area-inset-top, 0px) + 16px); right: max(14px, env(safe-area-inset-right, 0px)); font-size: 13px; }
    .card { padding: 22px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<input id="ti" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" aria-label="Type here">
<a class="back" href="/" target="_top">← all games</a>

<div id="hud" class="hidden">
  <div class="board panel">
    <div class="stat"><div id="score">0</div><div class="label" id="scoreLabel">WPM</div></div>
    <div class="stat"><div id="wpm" class="small">0</div><div class="label" id="wpmLabel">Accuracy</div></div>
    <div class="stat"><div id="third" class="small">0</div><div class="label" id="thirdLabel">Best</div></div>
  </div>
</div>

<div id="hint" class="hidden"><span id="hintText">Type the yellow letter to lay a plank</span></div>

<div id="overlay" class="on">
  <div class="card show wide" id="startCard">
    <div class="head"><div class="logo"><svg viewBox="0 0 28 28" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="4.5" r="2.3" fill="#fff"/><path d="M9 7.5v6.5M9 14l-3 4.5M9 14l3.5 3.5M9 9.5l-3 3M9 9.5l4 1.5"/><rect x="2.5" y="20" width="6" height="5" rx="1.2"/><rect x="11" y="20" width="6" height="5" rx="1.2"/><rect x="19.5" y="20" width="6" height="5" rx="1.2" stroke-dasharray="2 2"/></svg></div>
    <div><h1 class="title">Keep Bridging</h1><div class="sub">Type the words to build the bridge</div></div></div>
    <div class="nokb"><svg viewBox="0 0 64 40" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="60" height="36" rx="5"/><path d="M10 11h4M20 11h4M30 11h4M40 11h4M50 11h4M13 20h4M23 20h4M33 20h4M43 20h4M18 29h28"/></svg><p>This one needs a keyboard</p><div class="label">Come back on a laptop to play</div><a class="btn primary" href="/" target="_top">More games</a></div>
    <div class="parts" id="levels"></div>
    <button class="endless" id="endlessBtn"><span>Endless</span><span class="label" id="endlessBest"></span></button>
    <div class="lvname" id="lvName"></div>
    <div class="actions">
      <button class="btn primary" id="playBtn"><span id="playText">Play</span><kbd class="kbd-only">Enter</kbd></button>
    </div>
    <div class="foot" id="startFoot"></div>
  </div>
  <div class="card" id="endCard">
    <div class="row">
      <div class="label" id="endLabel">Splash</div>
      <span class="chip" id="endChip" style="display:none"></span>
    </div>
    <div class="result">
      <div><span id="endScore">0</span><div class="label" id="endScoreLabel">Planks</div></div>
      <div><div id="endBest">0</div><div class="label" id="endBestLabel">Best</div></div>
    </div>
    <div class="actions">
      <button class="btn primary" id="againBtn"><span id="againText">Try again</span><kbd class="kbd-only">Enter</kbd></button>
      <button class="btn ghost" id="levelsBtn" aria-label="All levels" title="All levels"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg></button>
      <button class="btn ghost" id="shareBtn" aria-label="Download image" title="Download image"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg></button>
    </div>
    <div class="foot" id="endFoot"></div>
  </div>
</div>
<div id="toast"></div>

<script>
const SLUG = 'bridging';
const GAME = 'Keep Bridging';
const COL = { bg: '#ffffff', ink: '#141414', fig: '#141414', muted: '#737373', faint: '#d4d4d4', butter: '#fde68a', butterHi: '#fcd34d', butterSoft: '#fef3c7', umber: '#78350f', accent: '#b45309', dot: 'rgba(31,41,55,0.13)' };
const cv = document.getElementById('c');
let ctx = cv.getContext('2d');

// Shared building blocks, from .claude/skills/game/references/snippets.js.

// ── Helpers ────────────────────────────────────────────────────────────────

const lerp = (a, b, k) => a + (b - a) * k;
const lerp2 = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const EASE = {
  io: (k) => (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2),
  in: (k) => k * k,
  out: (k) => 1 - (1 - k) * (1 - k),
  lin: (k) => k,
  soft: (k) => 0.5 - Math.cos(Math.PI * k) / 2,
};

function mulberry(a) {
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ── Stick figure ───────────────────────────────────────────────────────────
// Poses are joint positions in figure space: facing right, feet near y = -8, head near y = -121.
// Draw at (x, groundY + 8) so the feet touch the ground. Needs: Helpers, strokePath, COL.fig.
// Make new poses with mk({...}) by moving a few joints of BASE; play them with an Actor.

const THIGH = 30, SHIN = 30, UARM = 21, FARM = 21;
const LIMB = 5, ARM = 4.2, TORSO = 8.5, HEAD_R = 7.8, FAR = '#9a9a9a';
const BASE = {
  face: 1,
  head: [0, -121], chest: [0, -96], hip: [0, -65],
  fF: [1, -8], fB: [-4, -8], kF: [22, -38], kB: [10, -38],
  hF: [3, -57], hB: [-1, -57], eF: [-6, -78], eB: [-6, -78],
};
const mk = (o, base = BASE) => Object.assign({}, base, o);
const P = {};
P.stand = mk({});
P.ready = mk({ head: [2, -121], hF: [15, -84], eF: [5, -71], hB: [-4, -56], eB: [-6, -77] });
P.crouch = mk({ head: [6, -100], chest: [4, -76], hip: [-2, -46], kF: [24, -30], kB: [12, -28], hF: [16, -60], eF: [10, -56], hB: [-8, -52], eB: [-8, -60] });
P.leap = mk({ head: [4, -124], chest: [2, -99], hip: [0, -68], fF: [14, -30], fB: [-14, -26], kF: [20, -52], kB: [-2, -48], hF: [18, -140], eF: [16, -120], hB: [-14, -134], eB: [-12, -116] });
P.cheer = mk({ head: [0, -122], chest: [0, -97], hip: [0, -67], hF: [16, -136], hB: [-12, -134], eF: [14, -118], eB: [-12, -116] });
P.wince = mk({ head: [-3, -118], chest: [-2, -94], hip: [0, -65], kF: [20, -37], hF: [7, -125], eF: [19, -111], hB: [-7, -125], eB: [-20, -109] });
P.phew = mk({ head: [-1, -120], chest: [-1, -95], hip: [0, -65], hF: [13, -80], eF: [4, -68], hB: [2, -122], eB: [-14, -106] });
P.punch = mk({ head: [8, -118], chest: [6, -94], hip: [0, -64], kF: [24, -36], kB: [-8, -34], fF: [18, -8], fB: [-16, -8], hF: [44, -98], eF: [26, -96], hB: [2, -88], eB: [-6, -78] });

const PTS = ['head', 'chest', 'hip', 'fF', 'fB', 'kF', 'kB', 'hF', 'hB', 'eF', 'eB'];

// Joints only bend the way real ones do, in the figure's own facing-right space (y down):
// an elbow folds the forearm toward the front of the body (ARM_BEND), a knee folds the shin back (KNEE_BEND).
// Pass the bend as the last argument; the hint then only matters when the limb is almost straight.
const ARM_BEND = -1, KNEE_BEND = 1;
function ik(a, b, l1, l2, hint, bend) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  let d = Math.hypot(dx, dy);
  const base = Math.atan2(dy, dx);
  // Ease into full extension so a straightening limb's joint doesn't race across the last few units.
  const L = l1 + l2, soft = L * 0.96;
  if (d > soft) {
    d = soft + (L - soft) * (1 - Math.exp(-(d - soft) / (L - soft)));
  }
  d = Math.max(Math.abs(l1 - l2) + 0.01, Math.min(L - 0.001, d));
  const c = Math.max(-1, Math.min(1, (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d)));
  const ang = Math.acos(c);
  const j1 = [a[0] + l1 * Math.cos(base + ang), a[1] + l1 * Math.sin(base + ang)];
  const j2 = [a[0] + l1 * Math.cos(base - ang), a[1] + l1 * Math.sin(base - ang)];
  if (bend) {
    const side = (j) => (j[0] - a[0]) * (b[1] - j[1]) - (j[1] - a[1]) * (b[0] - j[0]);
    return Math.sign(side(j1)) === bend ? j1 : j2;
  }
  const d1 = Math.hypot(j1[0] - hint[0], j1[1] - hint[1]);
  const d2 = Math.hypot(j2[0] - hint[0], j2[1] - hint[1]);
  return d1 < d2 ? j1 : j2;
}
function catmull(p0, p1, p2, p3, t) {
  const t2 = t * t, t3 = t2 * t;
  return 0.5 * (2 * p1 + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 + (-p0 + 3 * p1 - 3 * p2 + p3) * t3);
}
function pathPose(list, u) {
  const n = list.length - 1;
  const x = Math.min(n - 1e-6, Math.max(0, u * n));
  const i = Math.floor(x), t = x - i;
  const a = list[Math.max(0, i - 1)], b = list[i], c = list[i + 1], d = list[Math.min(n, i + 2)];
  const o = { face: lerp(b.face, c.face, t), hang: lerp(b.hang ?? 1, c.hang ?? 1, t) };
  for (const k of PTS) {
    o[k] = [catmull(a[k][0], b[k][0], c[k][0], d[k][0], t), catmull(a[k][1], b[k][1], c[k][1], d[k][1], t)];
  }
  return o;
}

// An Actor plays queued pose steps: actor.push({ pose: P.crouch, d: 0.12 }, { pose: P.leap, d: 0.2, ez: 'out' }).
// A step can also be { path: [P.a, P.b, P.c], d } for a smooth curve through several poses, or { fn: () => {} } to run code.
class Actor {
  constructor(pose) {
    this.pose = pose || P.ready;
    this.q = [];
    this.step = null;
    this.t = 0;
    this.id = Math.random().toString(36).slice(2);
  }
  push(...steps) {
    this.q.push(...steps);
  }
  clear() {
    this.q = [];
    this.step = null;
  }
  get idle() {
    return !this.step && !this.q.length;
  }
  update(dt) {
    for (let guard = 0; guard < 20; guard++) {
      if (!this.step) {
        if (!this.q.length) {
          return;
        }
        this.step = this.q.shift();
        this.t = 0;
        if (this.step.fn) {
          const fn = this.step.fn;
          this.step = null;
          fn();
          continue;
        }
        const targets = this.step.path || (this.step.pose ? [this.step.pose] : [this.pose]);

const NOTES = [523, 587, 659, 784, 880, 1047, 1175, 1319];
function typeChar(c, caps) {

    return;
  }
  audio();
  c = c.replace(/[‘’]/g, "'").replace(/[“”]/g, '"');
  const want = text[pos];
  typed++;
  if (startedAt < 0) {
    startedAt = clock;
  }
  if (me.state === 'ready') {
    me.state = 'run';
  }
  if (c !== want) {
    typos++;
    streak = 0;
    wordTypo = true;
    drops.push({ x: X[pos] + charW(text[pos]) / 2, y: TH / 2 - 6, vy: -90, vx: 18, r: 0, vr: (Math.random() - 0.5) * 7, ch: c });

      loseHat();

    if (twist() === 'wobbly') {

    SND.bonk();
    buzz(15);
    if (c !== want && c.toLowerCase() === want.toLowerCase() && caps && ++capsWarn === 2) {

    return;

  pos++;
  streak++;
  bestStreak = Math.max(bestStreak, streak);
  if (want === ' ') {
    SND.thunk(0.35);

    const n = streak % 14;
    SND.plank(NOTES[n < 8 ? n : 14 - n]);

  dust((X[pos - 1] + X[pos]) / 2, 0, X[pos] - X[pos - 1], 3);

const botRng = mulberry(11);
let botNext = 0.9;
function bot() {
  if (me.state === 'fall' || pos >= text.length || clock < botNext) {

  }
  const want = text[pos];
  let c = want;
  if (botRng() < 0.045) {
    const k = 'asdfghjklqwertyuiopzxcvbnm';
    c = k[Math.floor(botRng() * k.length)];

  typeChar(c, false);
  let d = 0.34 + gauss(botRng) * 0.09;

    d += 0.25 + botRng() * 0.5;

    d += 0.2;

// ── Update ─────────────────────────────────────────────────────────────────

function splashAt(x, n) {
  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.6;
    const sp = 60 + Math.random() * 140;
    bits.push({ x: x + (Math.random() - 0.5) * 16, y: WATER - 2, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: Math.random() * 6, vr: (Math.random() - 0.5) * 10, c: i % 2 ? '#8d8d8d' : '#141414', t: 0, life: 0.6 + Math.random() * 0.4, w: 2 + Math.random() * 2, g: 420, drag: 1 });
  }
}

function update(dt) {
  clock += dt;
  updateFx(dt);
  updateWorld(dt);
  if (mode === 'play') {
    runTime += dt;
    if (BOT) {
      bot();
    }
    if (startedAt >= 0 && Math.floor(clock * 4) !== Math.floor((clock - dt) * 4)) {
      updateHud();
    }
    if (startedAt >= 0 && !isEndless() && me.state !== 'fall') {
      const n = Math.floor((clock - startedAt) / 0.1);
      while (rec.length <= n) {
        rec.push(Math.round(me.x * 10) / 10);
      }
    }
  }
  updateRunner(dt);
  updateGhost(dt);
  updateGoose(dt);
  updateWind(dt);
  updateHat(dt);
  updateTroll(dt);
  const t = camTarget();
  camX += (t - camX) * Math.min(1, dt * (me.state === 'fall' ? 2 : 5));
}

function updateWorld(dt) {
  wrongT -= dt;
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i];
    d.vy += 900 * dt;
    d.x += d.vx * dt;
    d.y += d.vy * dt;
    d.r += d.vr * dt;
    if (d.y > WATER - 6) {
      splashAt(d.x, 6);
      SND.plop();
      if (Math.abs(d.x - duck.x) < 22) {
        duck.bob = 1;
        SND.quack();
        popup('quack', '', false, duck.x, WATER - 30);
      }
      drops.splice(i, 1);
    }
  }
  duck.x += dt * 9;
  duck.bob = Math.max(0, duck.bob - dt * 2);
  const left = camX - viewW() / 2;
  if (duck.x < left - 60) {
    duck.x = left + viewW() + 80 + Math.random() * 200;
  }
  fishIn -= dt;
  if (fishIn <= 0) {
    fishIn = 7 + Math.random() * 9;
    const x = camX + viewW() * (0.05 + Math.random() * 0.35);
    if (x > 30) {
      fish.push({ x, t: 0, d: 0.9, h: 70 + Math.random() * 40, dir: Math.random() < 0.5 ? -1 : 1 });
    }
  }
  for (let i = fish.length - 1; i >= 0; i--) {
    const f = fish[i];
    const was = f.t;
    f.t += dt;
    if (was === 0) {
      splashAt(f.x, 5);
    }
    if (was < f.d && f.t >= f.d) {
      splashAt(f.x + f.dir * 46, 5);
      SND.plop();
    }
    if (f.t > f.d + 0.2) {
      fish.splice(i, 1);
    }
  }
}

function updateWind(dt) {

  const edge = done ? Infinity : X[pos];

    target = mode === 'menu' ? P.ready : P.look;

    }

        me.lurch = 0;

      me.recover -= dt;
      if (!target) {
        target = Object.assign({}, runPose(me.run, me.av), { hF: [24, -104], eF: [14, -84], hB: [18, -100], eB: [8, -82] });
        rate = 9;
      }
    }
  } else if (me.state === 'teeter') {
    me.tt += dt;
    edgeTime += dt;
    target = teeterPose(me.tt);
    rate = 24;
    if (me.tt > (isEndless() ? 0.65 : 0.85)) {
      me.state = 'fall';
      me.vy = -160;
      me.vx = 60;
      me.fallT = 0;
      SND.fall();
      kick(60);
    }
  } else if (me.state === 'fall') {
    me.fallT += dt;
    me.vy += 1500 * dt;
    me.y += me.vy * dt;
    me.x += me.vx * dt;
    me.spin += dt * 2.2;
    target = fallPose(me.fallT);
    rate = 22;
    if (!me.splashed && me.y > WATER - 40) {
      me.splashed = true;
      splashAt(me.x, 26);
      SND.splash();
      kick(120);
      buzz(40);
      fish.push({ x: me.x + 20, t: 0, d: 1.0, h: 110, dir: 1 });
    }
    if (me.fallT > 0.35 && mode === 'play') {
      finish(false);
    }
  }
  const running = me.state === 'run' && !target;
  me.av = approach(me.av, me.vx, dt * 500);
  me.run = (me.run + Math.PI * 2 * gait(me.av).cad * dt) % (Math.PI * 2);
  const runT = blendPose(P.stand, runPose(me.run, me.av), smooth(2, 30, me.av));
  me.runW = approach(me.runW, running ? 1 : 0, dt * (running ? 2.5 : 4));
  me.pose = followPose(me.pose, me.poseV, target || runT, target ? rate : lerp(18, 45, me.runW), dt, POSE_ACC);
}

// ── Render ─────────────────────────────────────────────────────────────────

const FONT = (s) => `400 ${s}px 'Balsamiq Sans', system-ui, sans-serif`;

function drawCliff(x0, dir, left, right) {
  ctx.strokeStyle = COL.ink;
  ctx.lineWidth = 2.2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  const far = dir < 0 ? left - 20 : right + 20;
  ctx.beginPath();
  ctx.moveTo(far, WOBBLE[3]);
  ctx.lineTo(x0, 0);
  const pts = [[2, 18], [-4, 40], [5, 66], [-2, 92], [8, WATER + 4]];
  for (const [dx, dy] of pts) {
    ctx.lineTo(x0 + dx * -dir, dy);
  }
  ctx.stroke();
  ctx.strokeStyle = '#c8c8c8';
  ctx.lineWidth = 1.6;
  for (let i = 0; i < 5; i++) {
    const hx = x0 + dir * (18 + i * 26), hy = 22 + ((i * 37) % 70);
    line(hx, hy, hx + dir * 10, hy + 6);
  }
}

// Each word is one board with its letters printed on it; spaces are rope gaps. Typing fills the board in.
function boardShape(x0, x1) {
  roundRect(x0 - PAD, 0, x1 - x0 + PAD * 2, TH, 6);
}
function drawLetters(from, to, x0, col) {
  ctx.font = FONT(20);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = col;
  for (let k = from; k < to; k++) {
    ctx.fillText(text[k], X[k] + 0.5, TH / 2 + 1);
  }
}
function drawBridge(left, right) {
  let i = idxAt(left - 40);
  while (i > 0 && text[i - 1] !== ' ') {
    i--;
  }
  const i1 = Math.min(text.length, idxAt(right + 40) + 1);
  const menu = mode === 'menu';
  while (i < i1) {
    if (text[i] === ' ') {
      const x0 = X[i] + PAD, x1 = X[i + 1] - PAD;
      const built = i < pos;
      ctx.save();
      if (!built) {
        ctx.setLineDash([3, 3]);
      }
      ctx.strokeStyle = built ? COL.ink : '#c4c4c4';
      ctx.lineWidth = built ? 1.8 : 1.5;
      ctx.lineCap = 'round';
      for (const y of [3, 9]) {
        ctx.beginPath();
        ctx.moveTo(x0 - 1, y);
        ctx.quadraticCurveTo((x0 + x1) / 2, y + 7, x1 + 1, y);
        ctx.stroke();
      }
      ctx.restore();
      if (i === pos && !menu) {
        const cx = (X[i] + X[i + 1]) / 2 + shakeX();
        const y = -2 - Math.sin(clock * 7) * 1.2;
        roundRect(cx - 9, y, 18, TH - 2, 5);
        inkShape(COL.butter, 2);
        ctx.strokeStyle = COL.umber;
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(cx - 4, y + 11);
        ctx.lineTo(cx - 4, y + 15);
        ctx.lineTo(cx + 4, y + 15);
        ctx.lineTo(cx + 4, y + 11);
        ctx.stroke();
      }
      i++;
      continue;
    }
    let j = i;
    while (j < text.length && text[j] !== ' ') {
      j++;
    }
    const gold = false;
    const done = pos >= j;
    if (done && (info[i].w % 2 === 0 || j - i > 5)) {
      const k = clamp((clock - (builtAt[j - 1] ?? -9)) / 0.25, 0, 1);
      const mx = (X[i] + X[j]) / 2;
      ctx.strokeStyle = COL.ink;
      ctx.lineWidth = 2;
      line(mx, TH, mx, TH + (WATER + 6 - TH) * EASE.out(k));
    }
    if (!done) {
      ctx.save();
      ctx.setLineDash([4, 4]);
      boardShape(X[i], X[j]);
      ctx.fillStyle = gold ? '#fffbeb' : '#ffffff';
      ctx.fill();
      ctx.strokeStyle = gold ? '#e0b44a' : '#bdbdbd';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();
    }
    if (pos > i) {
      let fx = X[Math.min(pos, j)];
      if (!done) {
        const k = EASE.out(clamp((clock - (builtAt[pos - 1] ?? -9)) / 0.1, 0, 1));
        fx = lerp(X[pos - 1], X[pos], k);
      }
      const x0 = X[i] - PAD, x1 = done ? X[j] + PAD : fx;
      roundRect(x0, 0, Math.max(8, x1 - x0), TH, 6);
      inkShape(gold ? COL.butterSoft : '#ffffff', 1.8);
      ctx.strokeStyle = gold ? '#f5dd9b' : '#ececec';
      ctx.lineWidth = 1.2;
      for (const y of [8, 18]) {
        line(x0 + 6, y, x1 - 6, y);
      }
    }
    const cur = !menu && pos >= i && pos < j;
    if (pos > i) {
      drawLetters(i, Math.min(pos, j), X[i], gold ? '#d6a94a' : '#b0b0b0');
    }
    if (cur) {
      const cx = X[pos] + shakeX();
      const w = X[pos + 1] - X[pos];
      roundRect(cx - 1.5, 2, w + 2, TH - 4, 4);
      ctx.fillStyle = COL.butter;
      ctx.fill();
      ctx.font = FONT(20);
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = COL.umber;
      ctx.fillText(text[pos], cx + 0.5, TH / 2 + 1);
    }
    const rest = Math.max(i, pos + (cur ? 1 : 0));
    if (rest < j) {
      drawLetters(rest, j, X[rest], gold ? COL.accent : COL.ink);
    }
    i = j;
  }
}
function shakeX() {
  return Math.sin(clock * 60) * 3 * Math.max(0, wrongT);
}

function drawDrops() {
  for (const d of drops) {
    ctx.save();
    ctx.translate(d.x, d.y);
    ctx.rotate(d.r);
    ctx.globalAlpha = 0.85;
    roundRect(-W / 2 + 1, -TH / 2 + 2, W - 2, TH - 4, 3);

    ctx.fillStyle = '#9a9a9a';

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

}

function drawWater(left, right) {
  ctx.strokeStyle = COL.ink;
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.beginPath();
  const x0 = Math.floor(left / 8) * 8;
  for (let x = x0; x <= right + 8; x += 8) {
    const y = WATER + Math.sin(x * 0.045 + clock * 1.6) * 1.8;

    } else {
      ctx.lineTo(x, y);

  }
  ctx.stroke();
  ctx.strokeStyle = '#c8c8c8';
  ctx.lineWidth = 1.6;
  const off = (clock * 12) % 120;
  for (let x = Math.floor(left / 120) * 120 - 120; x < right + 120; x += 120) {
    const wx = x + off;
    line(wx, WATER + 16, wx + 18, WATER + 16);
    line(wx + 60, WATER + 30, wx + 72, WATER + 30);
  }
}

function drawDuck() {
  const b = Math.sin(clock * 2.4) * 1.2 - duck.bob * 10 * Math.sin(duck.bob * Math.PI);
  ctx.save();
  ctx.translate(duck.x, WATER - 4 + b);

function drawFish(f) {
  const k = clamp(f.t / f.d, 0, 1);
  const x = f.x + f.dir * 46 * k;
  const y = WATER + 4 - f.h * 4 * k * (1 - k);

  const ang = Math.atan2(vy / f.d, (f.dir * 46) / f.d);
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  ctx.scale(1, f.dir);
  ctx.beginPath();
  ctx.ellipse(0, 0, 11, 6, 0, 0, Math.PI * 2);
  inkShape('#ffffff', 1.6);
  ctx.beginPath();
  ctx.moveTo(-10, 0);
  ctx.lineTo(-18, -6);
  ctx.lineTo(-18, 6);
  ctx.closePath();
  inkShape('#ffffff', 1.6);
  ctx.fillStyle = COL.ink;

}

function drawFlag(x) {
  ctx.strokeStyle = COL.ink;

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  const s = cam.s;
  const ox = cw / 2 - camX * s;

  const left = camX - viewW() / 2, right = camX + viewW() / 2;

  ctx.save();

  ctx.rect(left - 60, -1000, right - left + 120, 1000 + WATER - 1);

  drawDuck();

  drawBits();

}

const HAT_KINDS = 12;
function hatOf(i) {
  return i === LEVELS.length - 1 ? { k: 2, gold: true } : { k: i % HAT_KINDS, gold: i >= HAT_KINDS };
}
function cone(x0, x1, tipX, tipY, f) {
  ctx.beginPath();
  ctx.moveTo(x0, 0);
  ctx.lineTo(tipX, tipY);
  ctx.lineTo(x1, 0);
  ctx.closePath();
  inkShape(f, 1.6);
}
function drawHat(i, x, y, rot, alpha) {
  const { k, gold } = hatOf(i);

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot || 0);
  ctx.globalAlpha *= alpha ?? 1;

  ctx.lineCap = 'round';

    roundRect(-8, -19, 16, 19, 2);
    inkShape(f, 1.6);
    roundRect(-13, -2, 26, 4, 2);
    inkShape(f, 1.6);
    ctx.lineWidth = 2.2;
    line(-7, -6, 7, -6);
  } else if (k === 2) {
    ctx.beginPath();
    ctx.moveTo(-10, 1);
    ctx.lineTo(-11, -14);
    ctx.lineTo(-5, -7);
    ctx.lineTo(0, -17);
    ctx.lineTo(5, -7);
    ctx.lineTo(11, -14);
    ctx.lineTo(10, 1);
    ctx.closePath();
    inkShape(gold ? COL.butterHi : f, 1.6);
  } else if (k === 3) {
    ctx.beginPath();
    ctx.moveTo(-8, -7);
    ctx.arc(-6, -12, 5.5, Math.PI * 0.6, Math.PI * 1.6);
    ctx.arc(0, -17, 6.5, Math.PI * 1.1, Math.PI * 1.9);
    ctx.arc(6, -12, 5.5, Math.PI * 1.4, Math.PI * 2.4);
    ctx.lineTo(8, -7);
    ctx.closePath();
    inkShape(f, 1.6);
    roundRect(-8, -8, 16, 9, 2);
    inkShape(f, 1.6);
  } else if (k === 4) {
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(s * 7, -5);
      ctx.quadraticCurveTo(s * 17, -6, s * 15, -20);
      ctx.quadraticCurveTo(s * 12, -11, s * 5, -10);
      ctx.closePath();
      inkShape('#ffffff', 1.4);
    }
    ctx.beginPath();
    ctx.arc(0, 1, 10, Math.PI, 0);
    ctx.closePath();
    inkShape(f, 1.6);
    ctx.lineWidth = 1.4;
    line(-10, -2, 10, -2);
  } else if (k === 5) {
    ctx.lineWidth = 1.6;
    line(0, -9, 0, -15);
    const w = Math.cos(clock * 18) * 10;
    ctx.beginPath();
    ctx.ellipse(0, -16, Math.abs(w) + 1, 2.2, 0, 0, Math.PI * 2);
    inkShape(COL.butterHi, 1.3);
    ctx.beginPath();
    ctx.arc(0, 1, 10, Math.PI, 0);
    ctx.closePath();
    inkShape(f, 1.6);
    line(8, -1, 14, 0);
  } else if (k === 6) {
    ctx.beginPath();
    ctx.ellipse(0, 0, 16, 3.2, 0, 0, Math.PI * 2);
    inkShape(f, 1.5);
    ctx.beginPath();
    ctx.moveTo(-8, -1);
    ctx.lineTo(-9, -13);
    ctx.quadraticCurveTo(0, -8, 9, -13);
    ctx.lineTo(8, -1);
    ctx.closePath();
    inkShape(f, 1.6);
  } else if (k === 7) {
    ctx.beginPath();
    ctx.arc(0, 1, 10, Math.PI, 0);
    ctx.closePath();
    inkShape(f, 1.6);
    roundRect(-10, -3, 20, 5, 2);
    inkShape(f, 1.5);
    ctx.beginPath();
    ctx.arc(0, -11, 3.5, 0, Math.PI * 2);
    inkShape(COL.butterHi, 1.3);
  } else if (k === 8) {
    ctx.beginPath();
    ctx.moveTo(-16, 0);
    ctx.quadraticCurveTo(0, -24, 16, 0);
    ctx.quadraticCurveTo(0, -5, -16, 0);
    inkShape(gold ? COL.butter : COL.ink, 1.6);
    ctx.fillStyle = gold ? COL.ink : '#ffffff';
    ctx.beginPath();
    ctx.arc(0, -8, 2.4, 0, Math.PI * 2);
    ctx.fill();
  } else if (k === 9) {
    ctx.beginPath();
    ctx.moveTo(-9, 0);
    ctx.quadraticCurveTo(-1, -14, 8, -28);
    ctx.quadraticCurveTo(4, -12, 9, 0);
    ctx.closePath();
    inkShape(f, 1.6);
    ctx.beginPath();
    ctx.ellipse(0, 0, 14, 3, 0, 0, Math.PI * 2);
    inkShape(f, 1.5);
    ctx.fillStyle = COL.butterHi;
    ctx.beginPath();
    ctx.arc(1, -11, 2.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.lineWidth = 1.4;
    line(0, -9, 1, -18);
    for (let a = 0; a < 5; a++) {
      ctx.beginPath();
      ctx.arc(1 + Math.cos(a * 1.26) * 4, -20 + Math.sin(a * 1.26) * 4, 2.6, 0, Math.PI * 2);
      inkShape(COL.butterHi, 1.1);
    }
    ctx.beginPath();
    ctx.moveTo(-9, 0);
    ctx.lineTo(-7, -10);
    ctx.lineTo(7, -10);
    ctx.lineTo(9, 0);
    ctx.closePath();
    inkShape(f, 1.6);
  } else {
    cone(-10, 10, 0, -22, f);
    ctx.lineWidth = 2;
    line(-6, -8, 6, -8);
    line(-3, -15, 3, -15);
    roundRect(-13, -2, 26, 4, 1.5);
    inkShape(f, 1.4);
  }
  ctx.restore();
}
function hatOnHead(i, head, pose) {
  const ang = Math.atan2(pose.head[0] - pose.chest[0], pose.chest[1] - pose.head[1]);
  drawHat(i, head[0] + Math.sin(ang) * (HEAD_R - 2), head[1] - Math.cos(ang) * (HEAD_R - 2), ang);
}
function drawHatWord() {
  if (hatFx) {
    const k = EASE.io(clamp(hatFx.t / 0.45, 0, 1));
    const to = [me.x, me.y - 128];
    drawHat(lvl, lerp(hatFx.from[0], to[0], k), lerp(hatFx.from[1], to[1], k) - Math.sin(Math.PI * k) * 40, k * Math.PI * 2);

}

function drawTroll() {
  if (!troll || troll.up <= 0.01) {
    return;
  }
  const x = X[troll.at] + 30;
  const y = lerp(WATER + 34, 52, EASE.out(troll.up));

    ctx.lineTo(x + s * 18, y - 34);
    ctx.lineTo(x + s * 21, y - 20);
    ctx.closePath();
    inkShape('#ffffff', 1.5);
    ctx.beginPath();
    ctx.arc(x + s * 9, y - 6, 6, 0, Math.PI * 2);
    inkShape('#ffffff', 1.5);
    ctx.fillStyle = COL.ink;
    ctx.beginPath();
    ctx.arc(x + s * 9 - 2, y - 7, 2.4, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.strokeStyle = COL.ink;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x - 9, y + 12);
  ctx.quadraticCurveTo(x, y + 6, x + 9, y + 12);
  ctx.stroke();
  ctx.restore();
}
function drawTrollSay() {
  if (!troll || troll.up < 0.6) {
    return;
  }
  const say = troll.said >= 0 ? 'Go on then!' : 'Say please!';
  const x = X[troll.at] + 30;
  ctx.font = FONT(15);
  const w = ctx.measureText(say).width + 20;
  ctx.save();
  ctx.globalAlpha = clamp((troll.up - 0.6) / 0.4, 0, 1);
  const by = -128;
  roundRect(x + 24 - w / 2, by, w, 28, 9);
  inkShape('#ffffff', 1.6);
  ctx.beginPath();
  ctx.moveTo(x + 18, by + 28);
  ctx.lineTo(x + 10, by + 40);
  ctx.lineTo(x + 28, by + 28);
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  ctx.strokeStyle = COL.ink;
  ctx.lineWidth = 1.6;
  ctx.stroke();
  ctx.fillStyle = COL.ink;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(say, x + 24, by + 15);
  ctx.restore();
}

// Fog hides everything past the next word or two.
function fogStart() {
  let words = 0;
  for (let i = pos; i < text.length; i++) {
    if (text[i] === ' ' && i > 0 && text[i - 1] !== ' ' && ++words === 2) {
      return i + 1;
    }
  }
  return text.length;
}
function drawFog(right) {
  const x0 = X[fogStart()] - 6;
  if (x0 > right) {
    return;
  }
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,0.97)';
  ctx.strokeStyle = '#dcdcdc';
  ctx.lineWidth = 1.5;
  const edge = () => {
    ctx.moveTo(x0 + 6, -420);
    for (let y = -420; y < WATER - 6; y += 22) {
      const b = Math.sin(y * 0.09 + clock * 1.3) * 6;
      ctx.quadraticCurveTo(x0 - 14 + b, y + 11, x0 + b, Math.min(WATER - 6, y + 22));
    }
  };
  ctx.beginPath();
  edge();
  ctx.lineTo(right + 80, WATER - 6);
  ctx.lineTo(right + 80, -420);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  edge();
  ctx.stroke();
  for (let k = 0; k < 6; k++) {
    const wx = x0 + 40 + ((k * 97 + clock * 14) % Math.max(60, right - x0));
    const wy = -120 + ((k * 53) % 200);
    ctx.beginPath();
    ctx.moveTo(wx, wy);
    ctx.quadraticCurveTo(wx + 16, wy - 8, wx + 34, wy);
    ctx.stroke();
  }
  ctx.restore();
}
function drawLeaves() {
  for (const l of leaves) {
    ctx.save();
    ctx.translate(l.x, l.y);
    ctx.rotate(l.r);
    ctx.beginPath();
    ctx.ellipse(0, 0, 6, 3, 0, 0, Math.PI * 2);
    inkShape(l.gold ? COL.butterHi : '#ffffff', 1.2);
    ctx.restore();
  }
}

// ── Share image ────────────────────────────────────────────────────────────

function shareCanvas(res) {
  const SW = 1080, SH = 1350;
  const c = document.createElement('canvas');
  c.width = SW;
  c.height = SH;
  const prev = ctx;
  ctx = c.getContext('2d');
  const font = (s) => `400 ${s}px 'Balsamiq Sans', system-ui, sans-serif`;
  ctx.fillStyle = COL.bg;
  ctx.fillRect(0, 0, SW, SH);
  ctx.fillStyle = COL.dot;
  for (let y = 18; y < SH; y += 36) {
    for (let x = 18; x < SW; x += 36) {
      ctx.beginPath();
      ctx.arc(x, y, 1.6, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  const big = res.endless ? res.metres : res.cleared ? res.wpm : Math.round((100 * res.planks) / res.total) + '%';
  const label = res.endless ? 'METRES' : res.cleared ? 'WORDS A MINUTE' : 'OF THE BRIDGE';
  const top = res.endless ? (res.isBest ? 'PERSONAL BEST' : 'ENDLESS') : `LESSON ${res.level + 1} · ${LEVELS[res.level].name.toUpperCase()}`;
  ctx.fillStyle = COL.accent;
  ctx.font = font(30);
  ctx.letterSpacing = '4px';
  ctx.fillText(top, 82, 108);
  ctx.fillStyle = COL.ink;
  ctx.font = font(250);
  ctx.letterSpacing = '-4px';
  ctx.fillText(String(big), 70, 330);
  ctx.letterSpacing = '4px';
  ctx.fillStyle = COL.muted;
  ctx.font = font(30);
  ctx.fillText(label, 82, 386);
  const stats = res.endless ? [[res.wpm, 'WPM'], [res.acc + '%', 'ACCURACY']] : [[res.acc + '%', 'ACCURACY'], [res.streak, 'LONGEST CLEAN RUN']];
  stats.forEach(([v, l], i) => {
    ctx.fillStyle = COL.ink;
    ctx.font = font(64);
    ctx.letterSpacing = '0px';
    ctx.fillText(String(v), 82 + i * 300, 560);
    ctx.fillStyle = COL.muted;
    ctx.font = font(21);
    ctx.letterSpacing = '3px';
    ctx.fillText(l, 84 + i * 300, 600);
  });
  ctx.fillStyle = COL.faint;
  ctx.font = font(26);
  ctx.letterSpacing = '4px';
  ctx.fillText(GAME.toUpperCase(), 84, 1196);
  ctx.letterSpacing = '0px';

  const word = res.endless ? 'splash' : res.cleared ? 'yes!' : 'oops';
  ctx.save();
  ctx.translate(560, 1010);
  ctx.scale(2.4, 2.4);
  ctx.font = FONT(20);
  const ww = ctx.measureText(word).width;
  boardShape(-40, -40 + ww);
  inkShape('#ffffff', 1.8);
  ctx.strokeStyle = '#ececec';
  ctx.lineWidth = 1.2;
  line(-40, 8, -40 + ww, 8);
  line(-40, 18, -40 + ww, 18);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = COL.ink;
  ctx.fillText(word, -40, TH / 2 + 1);
  ctx.strokeStyle = COL.ink;
  ctx.lineWidth = 2;
  line(-40 + ww / 2, TH, -40 + ww / 2, WATER + 4);
  ctx.save();
  ctx.translate(-60, 0);
  const saveClock = clock;
  clock = 0;
  drawWater(-200, 260);
  const saveDuck = duck.x;
  duck.x = 170;
  duck.bob = 0;
  drawDuck();
  duck.x = saveDuck;
  clock = saveClock;
  ctx.restore();
  contactShadow(0, 16, 0.1);
  const sp = res.cleared ? P.cheer : teeterPose(0.12);
  const sh = drawFigure({ pose: sp, id: 'share' }, 10, 8, 0, { live: false });
  if (life.hat >= 0) {
    hatOnHead(life.hat, [sh.head[0] + 10, sh.head[1] + 8], sp);
  }
  ctx.restore();
  ctx = prev;
  return c;
}

let toastTimer = 0;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 2400);
}

async function share(res) {
  if (!res) {
    return;
  }
  try {
    await document.fonts.ready;
    const blob = await new Promise((r) => shareCanvas(res).toBlob(r, 'image/png'));
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${SLUG}-${res.endless ? res.metres + 'm' : 'lesson-' + (res.level + 1)}.png`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast('Image saved');
  } catch (e) {
    toast('Could not save the image');
  }
}

if (!unlocked(sel)) {
  sel = 0;
}
setupLevel(sel);
renderLevels();
document.fonts.ready.then(() => {
  widthOf = {};
  relayout();
});
if (BOT) {
  sel = LEVELS.length;
  startGame(LEVELS.length);
} else if (Q.has('autoplay')) {
  startGame(sel);
}

let last = performance.now();
function frame(now) {
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
  last = now;
  if (!window.__freeze) {
    update(dt);
  }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
